name: Custom Logic Tests

on:
  workflow_dispatch:
  push:
    branches:
      - custom
    paths:
      # 源文件列表和触发路径要保持一致
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlHighlighter.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlLines.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlLint.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlRename.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlFix.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlFixIndent.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlFixName.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/YamlPairs.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/TextSearch.kt'
      - 'app/src/main/java/com/github/kr328/clash/custom/RestoreCarrierSwitchPolicy.kt'
      - 'app/src/main/java/com/github/kr328/clash/custom/BackupExtrasRestorePolicy.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/CarrierSwitchTogglePolicy.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/CarrierSwitchModel.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/CarrierSwitchRename.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/ConfigProxyCount.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/NetworkIdentitySnapshot.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/CarrierOperatorConsensus.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/CarrierSwitchTargetCheck.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/SavedIpSortVisibility.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/CarrierSwitchMatcher.kt'
      - 'common/src/main/java/com/github/kr328/clash/common/custom/UptimeFormat.kt'
      - 'service/src/main/java/com/github/kr328/clash/service/custom/NotificationDisplayPolicy.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/IpTextFit.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/IpTestIpv6.kt'
      - 'design/src/main/java/com/github/kr328/clash/design/custom/editor/EditorWrapStyle.kt'
      - 'tests/custom/CarrierOperatorConsensusTests.kt'
      - 'tests/custom/CarrierSwitchRenameTests.kt'
      - 'tests/custom/ConfigProxyCountTests.kt'
      - 'tests/custom/SavedIpSortVisibilityTests.kt'
      - 'tests/custom/CarrierSwitchMatcherTests.kt'
      - 'tests/custom/CarrierSwitchTargetCheckTests.kt'
      - 'tests/custom/RestoreCarrierSwitchTests.kt'
      - 'tests/custom/BackupExtrasRestoreTests.kt'
      - 'tests/custom/TestMain.kt'
      - 'tests/custom/UptimeFormatTests.kt'
      - 'tests/custom/NotificationDisplayPolicyTests.kt'
      - 'tests/custom/IpTextFitTests.kt'
      - 'tests/custom/IpTestIpv6Tests.kt'
      - 'tests/custom/EditorWrapStyleTests.kt'
      - 'tests/custom/TextSearchTests.kt'
      - 'tests/custom/YamlHighlighterTests.kt'
      - 'tests/custom/YamlLintTests.kt'
      - 'tests/custom/YamlRenameTests.kt'
      - 'tests/custom/YamlFixTests.kt'
      - 'tests/custom/YamlPairsTests.kt'
      - 'scripts/run-custom-tests.sh'
      - '.github/workflows/test-custom.yaml'

jobs:
  custom-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Run custom logic tests
        run: bash scripts/run-custom-tests.sh

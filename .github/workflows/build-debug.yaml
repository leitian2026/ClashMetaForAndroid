name: Build Debug
on:
  workflow_dispatch: # CUSTOM: manual only (push / pull_request triggers removed)

jobs:
  BuildDebug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      # CUSTOM (CUSTOM.md #18): the core source (submodule mihomo) is the biggest download of the build.
      # Its git data is cached per pinned commit, and the checkout is retried when GitHub is busy.
      - name: Submodule commit
        id: submodule
        run: echo "sha=$(git ls-tree HEAD core/src/foss/golang/clash | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Restore submodule cache
        id: submodule-cache
        uses: actions/cache/restore@v5
        with:
          path: .git/modules
          key: submodule-${{ steps.submodule.outputs.sha }}

      - name: Checkout submodules
        run: |
          for i in 1 2 3 4 5 6; do
            git submodule update --init --recursive --force && exit 0
            echo "submodule checkout failed, retry $i/6"
            # a half-finished clone would make the next try fail too
            git submodule deinit -f --all 2>/dev/null || true
            rm -rf core/src/foss/golang/clash .git/modules/clash-foss
            sleep 20
          done
          exit 1

      - name: Save submodule cache
        if: steps.submodule-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .git/modules
          key: submodule-${{ steps.submodule.outputs.sha }}

      # CUSTOM (CUSTOM.md #20): patch for the mihomo core (counts the open sockets per node). The build
      # stops here when a patch does not apply, so it is never silently left out.
      - name: Apply mihomo patches
        run: |
          set -e
          cd core/src/foss/golang/clash
          for p in "$GITHUB_WORKSPACE"/patches/mihomo/*.patch; do
            echo "applying $p"
            patch -p1 --no-backup-if-mismatch --dry-run < "$p"
            patch -p1 --no-backup-if-mismatch < "$p"
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # CUSTOM (CUSTOM.md #18): the patched Go toolchain is cached (it is downloaded from a GitHub release
      # and patched on every run otherwise). With the folder restored, setup-go finds the toolchain in
      # the tool cache and downloads nothing. The key contains the hash of the patches.
      - name: Restore Go toolchain cache
        id: go-toolchain-cache
        uses: actions/cache/restore@v5
        with:
          path: /opt/hostedtoolcache/go-*
          key: go-toolchain-1.26-${{ hashFiles('.github/patch/*.patch') }}

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          # CUSTOM: a toolchain restored from the cache is already patched
          if [ -f .patched ]; then
            echo "toolchain already patched"
          else
            for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done
            touch .patched
          fi

      - name: Save Go toolchain cache
        if: steps.go-toolchain-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: /opt/hostedtoolcache/go-*
          key: go-toolchain-1.26-${{ hashFiles('.github/patch/*.patch') }}


      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Update CA
        run: |
          # CUSTOM: the runner image already has the package; only install it when it is missing
          dpkg -s ca-certificates >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ca-certificates; }
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      # CUSTOM: fixed signing (keystore + passwords from repo secrets; CI workspace only, never committed)
      - name: Signing properties
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties

      # CUSTOM: retry wrapper download (services.gradle.org / github releases sometimes time out or return 504)
      - name: Prefetch Gradle wrapper
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle wrapper download failed, retry $i/8"; sleep 20
          done
          exit 1

      # CUSTOM (CUSTOM.md #14, #18): keep the last downloaded geo files in the Actions cache. They are
      # only a fallback: the files are still downloaded fresh on every run, but when GitHub keeps
      # failing the build uses the cached copy instead of failing.
      - name: Restore geo files cache
        uses: actions/cache@v5
        with:
          path: app/src/main/assets
          key: geo-files-${{ github.run_id }}
          restore-keys: |
            geo-files-

      # CUSTOM: download the geo files with retries. The upstream Gradle task `downloadGeoFiles` has
      # none, so one 504 from GitHub fails the whole build; the Build step below skips that task.
      - name: Prefetch geo files
        run: |
          mkdir -p app/src/main/assets
          base=https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest
          fetch() {
            out="app/src/main/assets/$2"
            for i in 1 2 3 4 5 6 7 8; do
              # download next to the target, so a failed try never destroys a cached copy
              if curl -fL --connect-timeout 20 --max-time 300 -o "$out.part" "$base/$1" && [ -s "$out.part" ]; then
                mv -f "$out.part" "$out"
                return 0
              fi
              rm -f "$out.part"
              echo "$2 download failed, retry $i/8"; sleep 20
            done
            if [ -s "$out" ]; then
              echo "::warning::$2 download failed, using the copy from the Actions cache"
              return 0
            fi
            return 1
          }
          fetch geoip.metadb geoip.metadb
          fetch geosite.dat geosite.dat
          fetch GeoLite2-ASN.mmdb ASN.mmdb
          fetch BundleMRS.7z BundleMRS.7z
          ls -l app/src/main/assets

      # CUSTOM (CUSTOM.md #18): Gradle installs CMake 3.22.1 from Google on every run; keep it
      - name: Restore CMake cache
        id: cmake-cache
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-cmake-3.22.1

      - name: Build
        if: success()
        # CUSTOM: arm64-v8a only (skips Go/C++ builds for the other 3 ABIs)
        # CUSTOM: -x :app:downloadGeoFiles, the files were fetched (with retries) by "Prefetch geo files"
        run: ./gradlew --no-daemon -Pandroid.injected.build.abi=arm64-v8a -x :app:downloadGeoFiles app:assembleAlphaRelease
          
      - name: Save CMake cache
        if: always() && steps.cmake-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-cmake-3.22.1

      # CUSTOM: show where the APK actually ended up (with injected ABI it stays under build/intermediates)
      - name: List APK files
        run: find app/build -name "*.apk" -print

      # CUSTOM (CUSTOM.md #40): the artifact is named after the delivery in CUSTOM.md ("当前版本：") and the build time
      - name: Artifact name
        id: label
        run: |
          ver=$(sed -n 's/^当前版本：//p' CUSTOM.md | head -1 | tr -d '[:space:]')
          echo "name=CMFA-custom-${ver:-unknown}-$(TZ=Asia/Shanghai date +%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      # CUSTOM: single arm64-v8a upload (other ABI upload steps removed)
      - name: Upload Aritfact (arm64-v8a)
        uses: actions/upload-artifact@v7
        if: ${{  success() }}
        with:
          name: ${{ steps.label.outputs.name }} # CUSTOM.md #40
          path: |
            app/build/intermediates/apk/alpha/release/*.apk
          if-no-files-found: error
